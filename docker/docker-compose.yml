services:

  postgres:
    image: postgres:16
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  atlas-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atlas-app
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env
    volumes:
      - ..:/app
    working_dir: /app
    command: python main.py

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: atlas-scheduler
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env
    volumes:
      - ..:/app
    working_dir: /app
    command: python -m scheduler.scheduler

volumes:
  postgres_data:
  redis_data: