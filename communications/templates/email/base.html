<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: Arial, sans-serif;
    "
  >
    <!-- Outer Wrapper -->
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #0f172a"
    >
      <tr>
        <td align="center" style="padding: 20px 10px">
          <!-- Responsive Container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #111827;
              border-radius: 10px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(90deg, #6366f1, #8b5cf6);
                  padding-inline: 20px;
                  padding-block: 10px;
                  text-align: center;
                "
              >
                <!-- Logo -->

                <img
                  src="https://iili.io/qgDN9Eb.png"
                  alt="Atlas Logo"
                  width="200px"
                  style="display: block; margin: 0 auto 10px"
                />
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td
                style="
                  padding: 20px;
                  color: #e5e7eb;
                  font-size: 14px;
                  line-height: 1.6;
                "
              >
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 0 20px">
                <hr style="border: none; border-top: 1px solid #374151" />
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 15px 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #9ca3af;
                "
              >
                <p style="margin: 0">Atlas AI System</p>
                <p style="margin: 5px 0 0">
                  Generated automatically by your AI agents
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
